name: build-apk
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
on:
  push: { branches: [main, feature/ngr-universal-library, feature/metro-save-manager] }
  pull_request: { branches: [main] }
  workflow_dispatch: {}
  schedule:
    - cron: '17 */6 * * *'
jobs:
  tools:
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Publish the trimmed NDK (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download tools --pattern ndk-lite-r27c.tar.xz.sha256 -O /tmp/have.sha 2>/dev/null; then echo "already published"; exit 0; fi
          bash tools/make_ndk_lite.sh
          gh release create tools --prerelease --title "Build tools (trimmed Android NDK)" --notes "Only the parts of NDK r27c that the ARM host build reads. Made by tools/make_ndk_lite.sh." 2>/dev/null || true
          gh release upload tools /tmp/ndk-lite-r27c.tar.xz /tmp/ndk-lite-r27c.tar.xz.sha256 --clobber
  prebuilt:
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build the porter's .NET tools with runtimes that start on phones
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/make_prebuilt.sh
  apk:
    # not on the 6-hourly schedule (that only refreshes the .NET tools)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Does the APK need rebuilding?
        id: chg
        run: |
          # Always produce a test APK on the NGR feature branch; payload-only updates must remain installable for device testing.
          build=true
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -Ev '^(app/src/main/assets/nx2a/payload/|docs/|tests/|README\.md$|tools/make_prebuilt\.sh$|\.github/workflows/)' || true)
            [ -z "$other" ] && build=false
            if [ "${{ github.ref }}" = "refs/heads/feature/ngr-universal-library" ] || [ "${{ github.ref }}" = "refs/heads/feature/metro-save-manager" ]; then build=true; fi
            echo "changed outside the payload: ${other:-nothing}"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.chg.outputs.build == 'true'
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.chg.outputs.build == 'true'
        with: { gradle-version: '8.10.2' }
      - name: Bundle proot and the Ubuntu rootfs
        if: steps.chg.outputs.build == 'true'
        run: |
          bash tools/fetch_proot.sh
          bash tools/fetch_rootfs.sh
      - name: Check Python payload syntax and runtime installer tests
        run: |
          python3 -m py_compile app/src/main/assets/nx2a/payload/apply_patches.py app/src/main/assets/nx2a/payload/porter_sync.py app/src/main/assets/nx2a/payload/webgui/server.py app/src/main/assets/nx2a/payload/runtime_install.py app/src/main/assets/nx2a/payload/profile_export.py app/src/main/assets/nx2a/launcher.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          cc -std=c11 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/test_profile_json.c app/src/main/cpp/ngr_profile.c -o /tmp/test_profile_json
          /tmp/test_profile_json
      - name: Verify NGR patch set against the pinned porter
        run: |
          upstream_sha="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/nx2a/payload/payload.json"))["porter_sha"])')"
          git init /tmp/nx2a-upstream
          git -C /tmp/nx2a-upstream remote add origin https://github.com/shirai91/nx2android.git
          git -C /tmp/nx2a-upstream fetch --depth 1 origin "$upstream_sha"
          git -C /tmp/nx2a-upstream checkout --detach FETCH_HEAD
          python3 app/src/main/assets/nx2a/payload/apply_patches.py /tmp/nx2a-upstream
          python3 app/src/main/assets/nx2a/payload/apply_patches.py /tmp/nx2a-upstream
          grep -q 'NX2A_ALIAS_MSAA_RESOLVE' /tmp/nx2a-upstream/nxnative/dm/android/gfx_vk_tex.c
          grep -q 'NX2A_INDEX_CHUNK_COPY' /tmp/nx2a-upstream/nxnative/dm/android/gfx_vk_exec.c
      - name: Check WebView JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/assets/nx2a/payload/webgui/index.html').read_text()
          script = source.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/nx2a-webgui.js').write_text(script)
          PY
          node --check /tmp/nx2a-webgui.js
      - name: The payload manifest must match the payload files
        run: |
          python3 tools/make_manifest.py
          git diff --exit-code app/src/main/assets/nx2a/payload/payload.json || { echo "payload.json is out of date: run  python3 tools/make_manifest.py --bump  and commit"; exit 1; }
      - name: Signing key
        if: steps.chg.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            { echo "KS_FILE=$RUNNER_TEMP/release.p12"; echo "KS_PASS=$KEYSTORE_PASS"; echo "KS_ALIAS=$KEYSTORE_ALIAS"; } >> "$GITHUB_ENV"
          else
            bash tools/signing_key.sh
          fi
      - name: Build the signed release APK
        if: steps.chg.outputs.build == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          gradle --no-daemon assembleRelease
      - name: Compile patched NVN Vulkan backend and SPIR-V shaders
        if: steps.chg.outputs.build == 'true'
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK/ndk/27.2.12479018"
          # Metro 2033 Redux has no game.tsv in the pinned Porter yet. Use an
          # existing profile only as a compile-time smoke-test configuration;
          # this binary is NOT a Metro runtime and must not be shipped as one.
          PROFILE_ID=0100CD701434C000
          python3 /tmp/nx2a-upstream/nxnative/dm/games/game.py list | grep -q "^$PROFILE_ID"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$NDK/shader-tools/linux-x86_64/glslc"
          python3 /tmp/nx2a-upstream/nxnative/dm/android/build.py \
            --game "$PROFILE_ID" --ndk "$NDK" --lib --release --jobs 4
          test -s "/tmp/nx2a-upstream/nxnative/dm/android/out/$PROFILE_ID-release/libdmhost.so"
          mkdir -p artifacts/nvn-backend-build-check
          cp "/tmp/nx2a-upstream/nxnative/dm/android/out/$PROFILE_ID-release/libdmhost.so" artifacts/nvn-backend-build-check/libdmhost.so
          printf 'Compile-check profile: %s (Twelve Minutes)\\nPorter commit: %s\\nPayload version: %s\\n' "$PROFILE_ID" "$upstream_sha" "$(python3 -c 'import json; print(json.load(open("app/src/main/assets/nx2a/payload/payload.json"))["version"])')" > artifacts/nvn-backend-build-check/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        if: steps.chg.outputs.build == 'true'
        with: { name: nx2android-apk, path: 'app/build/outputs/apk/release/*.apk' }
      - uses: actions/upload-artifact@v4
        if: steps.chg.outputs.build == 'true'
        with: { name: nvn-backend-build-check, path: 'artifacts/nvn-backend-build-check/*' }
      - name: Publish the APK as the latest release
        if: steps.chg.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" nx2android.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          { echo "Built from $GITHUB_SHA."; echo; echo '```'; tail -c 1500 "${SIGN_LOG:-/dev/null}" 2>/dev/null; echo '```'; } > "$RUNNER_TEMP/notes.md"
          gh release create latest nx2android.apk --prerelease --target "$GITHUB_SHA" --title "nx2android (latest build)" --notes-file "$RUNNER_TEMP/notes.md"
\\t'
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$NDK/shader-tools/linux-x86_64/glslc"
          python3 /tmp/nx2a-upstream/nxnative/dm/android/build.py \
            --game "$PROFILE_ID" --ndk "$NDK" --lib --release --jobs 4
          test -s "/tmp/nx2a-upstream/nxnative/dm/android/out/$PROFILE_ID-release/libdmhost.so"
          mkdir -p artifacts/nvn-backend-build-check
          cp "/tmp/nx2a-upstream/nxnative/dm/android/out/$PROFILE_ID-release/libdmhost.so" artifacts/nvn-backend-build-check/libdmhost.so
          printf 'Compile-check profile: %s (Twelve Minutes)\\nPorter commit: %s\\nPayload version: %s\\n' "$PROFILE_ID" "$upstream_sha" "$(python3 -c 'import json; print(json.load(open("app/src/main/assets/nx2a/payload/payload.json"))["version"])')" > artifacts/nvn-backend-build-check/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        if: steps.chg.outputs.build == 'true'
        with: { name: nx2android-apk, path: 'app/build/outputs/apk/release/*.apk' }
      - uses: actions/upload-artifact@v4
        if: steps.chg.outputs.build == 'true'
        with: { name: metro2033redux-native-runtime, path: 'artifacts/metro2033redux/*' }
      - name: Publish the APK as the latest release
        if: steps.chg.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" nx2android.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          { echo "Built from $GITHUB_SHA."; echo; echo '```'; tail -c 1500 "${SIGN_LOG:-/dev/null}" 2>/dev/null; echo '```'; } > "$RUNNER_TEMP/notes.md"
          gh release create latest nx2android.apk --prerelease --target "$GITHUB_SHA" --title "nx2android (latest build)" --notes-file "$RUNNER_TEMP/notes.md"
